services:
  health-fetch:
    build: .
    container_name: health-fetch
    restart: unless-stopped
    volumes:
      - ./tokens:/app/tokens
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - TOKEN_PATH=/app/tokens/token.json
      - INFLUXDB_HOST=health-influxdb
      - INFLUXDB_PORT=8086
      - INFLUXDB_DATABASE=HealthStats
      - INFLUXDB_USERNAME=health_user
      - INFLUXDB_PASSWORD=health_password
      - DEVICE_NAME=${DEVICE_NAME:-Pixel Watch}
      - BACKFILL_DAYS=${BACKFILL_DAYS:-30}
      - INTERVAL_SECONDS=${INTERVAL_SECONDS:-300}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - health-influxdb

  health-influxdb:
    image: influxdb:1.11
    container_name: health-influxdb
    restart: unless-stopped
    environment:
      - INFLUXDB_DB=HealthStats
      - INFLUXDB_USER=health_user
      - INFLUXDB_USER_PASSWORD=health_password
      - INFLUXDB_DATA_INDEX_VERSION=tsi1
    volumes:
      - ./influxdb:/var/lib/influxdb
