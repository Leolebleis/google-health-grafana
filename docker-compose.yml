services:
  health-fetch:
    build: .
    container_name: health-fetch
    restart: unless-stopped
    volumes:
      - ./tokens:/app/tokens
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - TOKEN_PATH=/app/tokens/token.json
      - INFLUXDB_URL=http://health-influxdb:8181
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_DATABASE=${INFLUXDB_DATABASE:-health}
      - DEVICE_NAME=${DEVICE_NAME:-Pixel Watch}
      - BACKFILL_DAYS=${BACKFILL_DAYS:-30}
      - INCREMENTAL_WINDOW_DAYS=${INCREMENTAL_WINDOW_DAYS:-2}
      - INTERVAL_SECONDS=${INTERVAL_SECONDS:-300}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - health-influxdb

  health-influxdb:
    image: influxdb:3-core
    container_name: health-influxdb
    restart: unless-stopped
    ports:
      - "8181:8181"
    command: >
      influxdb3 serve
      --node-id=rpi-health
      --object-store=file
      --data-dir=/var/lib/influxdb3/data
      --exec-mem-pool-bytes=536870912
      --datafusion-num-threads=2
      --disable-telemetry-upload
      --query-file-limit=10000
      --without-auth
    # query-file-limit: Core has no compaction, so parquet files accumulate
    # (~100/day per hot table) and multi-day queries exceed the default 432.
    # fetch.py's incremental window slows the growth; this raises the ceiling.
    volumes:
      - ./influxdb3:/var/lib/influxdb3/data
