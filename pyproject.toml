[project]
name = "google-health-grafana"
version = "0.1.0"
description = "Google Health API fetcher + Xiaomi S400 scale reader for Grafana"
requires-python = ">=3.13"
dependencies = [
    "bleak>=0.21.0",
    "pycryptodome>=3.20.0",
    "influxdb-client>=1.40.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-mock>=3",
    "pytest-cov>=6",
    "ruff>=0.11",
    "ty>=0.0.20",
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["scale", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "COM812",
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "PLR2004", "S104", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["scale"]
omit = ["scale/measurement/scanner_facade.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scale"]
